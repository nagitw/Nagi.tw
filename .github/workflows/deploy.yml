name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

env:
  SITE_URL: https://nagitw.github.io
  SITE_BASE: /Nagi.tw/
  PUBLIC_PENGUIN_AI_MODE: offline
  PUBLIC_PENGUIN_API_URL: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and Astro Check
        run: npm run typecheck && npm run check
      - name: Astro Build
        run: npm run build
      - name: Unit and integration tests
        run: npm test && npm run test:ai
      - name: Production Artifact Validation
        run: npm run validate:production
      - name: Editorial regression checks
        run: node scripts/test-editorial.mjs && node scripts/test-editorial-regressions.mjs && node scripts/test-editorial-build.mjs
      - name: Dependency Audit
        run: npm audit --audit-level=high
      - name: Source Secret Scan
        run: npm run test:secrets -- --history
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m pip_audit -r requirements.lock

  browser:
    runs-on: ubuntu-latest
    env:
      PUBLIC_PENGUIN_AI_MODE: offline
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run test:browser && npx playwright test --config scripts/browser/v3.1.config.mjs

  deploy:
    needs: [build, backend, browser]
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
