name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'FINAL-RELEASE.md'
      - 'CONTENT-AUDIT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci
      - run: npm run test:schema && npm run test:i18n && node scripts/about.test.mjs
      - run: node scripts/security-migration.mjs --originals-only
      - run: npm run check && npm run build
      - run: npm run test:penguin && npm run verify:static && node scripts/verify-about.mjs && npm run verify:release
      - run: npm run verify:recovery
      - run: npm audit --audit-level=high
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
